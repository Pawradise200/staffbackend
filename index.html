<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Pawradise 員工系統</title>
<link rel="icon" href="pawradise-logo.jpg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fredoka:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap');

:root {
  --pw-navy:#2C4A6E; --pw-navy-deep:#1F3552; --pw-navy-light:#4A7BAF;
  --pw-gold:#F4B860; --pw-gold-deep:#E08850;
  --pw-cream:#F5F0E8; --pw-cream-soft:#FAF5EE; --pw-cream-deep:#EDE6D8;
  --pw-paper:#FFFFFF; --pw-ink:#1F3552; --pw-ink-soft:#2C4A6E;
  --pw-ink-mute:#6B7A8F; --pw-ink-faint:#A8B2C0; --pw-ink-ghost:#C8D0DA;
  --pw-brown:#7B5538; --pw-brown-deep:#5C3E27; --pw-tan:#D9994A; --pw-heart:#EF6E6E;
  --pw-cat-sniff:#6B8E3D; --pw-cat-lick:#FF8C42; --pw-cat-puzzle:#0E7490;
  --pw-cat-frozen:#60A5FA; --pw-cat-explore:#3B82F6; --pw-cat-bond:#F4A6B8;
  --pw-success:#15803D; --pw-success-bg:#DCFCE7; --pw-warn:#A16207; --pw-warn-bg:#FEF9C3;
  --pw-danger:#B91C1C; --pw-danger-bg:#FEE2E2; --pw-info:#1D4ED8; --pw-info-bg:#DBEAFE;
  --pw-violet:#6D28D9; --pw-violet-bg:#EDE9FE;
  --pw-r-xs:6px; --pw-r-sm:8px; --pw-r-md:12px; --pw-r-lg:18px; --pw-r-xl:24px; --pw-r-pill:999px;
  --pw-space-1:4px; --pw-space-2:8px; --pw-space-3:12px; --pw-space-4:16px; --pw-space-5:24px; --pw-space-6:32px; --pw-space-7:48px;
  --pw-shadow-card:0 4px 20px rgba(92,62,39,.12); --pw-shadow-hover:0 8px 28px rgba(92,62,39,.18);
  --pw-shadow-header:0 2px 16px rgba(44,28,16,.28); --pw-shadow-pop:0 12px 40px rgba(92,62,39,.20);
  --pw-shadow-inset:inset 0 0 0 1.5px var(--pw-cream-deep);
  --pw-stroke:1.5px; --pw-stroke-focus:2px;
  --pw-font-sans:'Nunito','Helvetica Neue',system-ui,sans-serif;
  --pw-font-display:'Fredoka','Nunito',sans-serif;
  --pw-font-serif:'Cormorant Garamond',Georgia,serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--pw-font-sans); background: var(--pw-cream); -webkit-font-smoothing: antialiased; }
img { display: block; }

/* App shell — centred mobile column */
#root { min-height: 100vh; }
.pwd-app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--pw-cream); box-shadow: 0 0 60px rgba(44,74,110,.10); position: relative; }

/* Loading screen */
.pwd-loading { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--pw-navy-deep); }
.pwd-loading img { width: 120px; opacity: .95; }
.pwd-spinner { width: 36px; height: 36px; border: 3.5px solid rgba(255,255,255,.25); border-top-color: var(--pw-gold); border-radius: 50%; animation: pwSpin .8s linear infinite; }
@keyframes pwSpin { to { transform: rotate(360deg); } }
.pwd-loading-txt { font-size: 12.5px; font-weight: 800; color: rgba(255,255,255,.7); letter-spacing: .04em; }

/* Screen shell */
.pwd-screen { min-height: 100vh; background: var(--pw-cream); color: var(--pw-ink); display: flex; flex-direction: column; }
.pwd-eyebrow { font-weight: 900; font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--pw-ink-faint); }

/* Header (gold) */
.pwd-header { background: var(--pw-gold); padding: calc(env(safe-area-inset-top, 0px) + 16px) 18px 13px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 14px rgba(44,28,16,.16); position: sticky; top: 0; z-index: 20; }
.pwd-h-logo { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; background: #fff; border: 2px solid rgba(31,53,82,.22); flex-shrink: 0; }
.pwd-h-logo img { width: 100%; height: 100%; object-fit: cover; }
.pwd-h-text { flex: 1; min-width: 0; }
.pwd-h-text h1 { font-size: 19px; font-weight: 900; color: var(--pw-ink); letter-spacing: -.01em; }
.pwd-h-text p { font-size: 11px; font-weight: 700; color: rgba(31,53,82,.62); margin-top: 1px; }
.pwd-h-ava { width: 38px; height: 38px; border-radius: 50%; background: var(--pw-navy); color: #fff; font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 2px solid rgba(255,255,255,.35); }
.pwd-h-logout { border: none; background: none; padding: 0; cursor: pointer; flex-shrink: 0; }

/* Body */
.pwd-body { padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 14px; flex: 1; }

/* Bottom tab bar */
.pwd-tabbar { position: sticky; bottom: 0; z-index: 30; display: flex; background: var(--pw-paper); border-top: 1.5px solid var(--pw-cream-deep); padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 10px); box-shadow: 0 -3px 16px rgba(44,74,110,.07); }
.pwd-tabbtn { flex: 1; border: none; background: none; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 800; font-size: 11px; color: var(--pw-ink-faint); cursor: pointer; padding: 4px; transition: color .15s; }
.pwd-tabbtn.on { color: var(--pw-navy); }
.pwd-tabbtn-ico { font-size: 21px; line-height: 1; filter: grayscale(1); opacity: .55; transition: all .15s; }
.pwd-tabbtn.on .pwd-tabbtn-ico { filter: none; opacity: 1; }

.pwd-card { background: var(--pw-paper); border-radius: var(--pw-r-lg); box-shadow: var(--pw-shadow-card); padding: 18px; }
.pwd-block { display: flex; flex-direction: column; gap: 14px; }

/* Duty roster */
.pwd-roster-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pwd-roster-nav { display: flex; align-items: center; gap: 6px; flex: 1; }
.pwd-wk-btn { width: 32px; height: 32px; border-radius: var(--pw-r-md); border: 1.5px solid var(--pw-cream-deep); background: var(--pw-paper); color: var(--pw-navy); font-size: 19px; font-weight: 700; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; }
.pwd-wk-btn:hover:not(:disabled) { background: var(--pw-navy); border-color: var(--pw-navy); color: #fff; }
.pwd-wk-btn:disabled { opacity: .35; cursor: default; }
.pwd-roster-weekbox { flex: 1; text-align: center; }
.pwd-roster-week { font-family: var(--pw-font-display); font-weight: 700; font-size: 18px; color: var(--pw-navy-deep); line-height: 1.1; }
.pwd-roster-tag { font-size: 10px; font-weight: 900; letter-spacing: .04em; color: var(--pw-ink-faint); margin-top: 1px; }
.pwd-wk-today { border: 1.5px solid var(--pw-navy); background: var(--pw-paper); color: var(--pw-navy); font-family: inherit; font-weight: 900; font-size: 11px; padding: 6px 11px; border-radius: var(--pw-r-pill); cursor: pointer; flex-shrink: 0; }
.pwd-wk-today:hover { background: var(--pw-navy); color: #fff; }
.pwd-roster-sum { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11.5px; font-weight: 800; color: var(--pw-ink-mute); background: var(--pw-cream-soft); border-radius: var(--pw-r-pill); padding: 7px 12px; margin-top: 12px; }
.pwd-roster-sum b { font-family: var(--pw-font-display); font-weight: 700; font-size: 15px; color: var(--pw-navy); }
.pwd-roster-sum .dot { color: var(--pw-ink-faint); }
.pwd-duty { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
.pwd-duty-row { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: var(--pw-r-md); background: var(--pw-cream-soft); }
.pwd-duty-row.today { background: #FFF7E8; box-shadow: inset 0 0 0 1.5px var(--pw-gold); }
.pwd-duty-row.off { opacity: .55; }
.pwd-duty-date { display: flex; flex-direction: column; align-items: center; width: 28px; flex-shrink: 0; }
.pwd-duty-wd { font-size: 10px; font-weight: 800; color: var(--pw-ink-faint); }
.pwd-duty-num { font-family: var(--pw-font-display); font-weight: 700; font-size: 18px; color: var(--pw-ink); line-height: 1; }
.pwd-duty-info { flex: 1; display: flex; align-items: center; gap: 7px; min-width: 0; }
.pwd-duty-shift { font-size: 12.5px; font-weight: 900; color: var(--pw-ink); }
.pwd-duty-row.off .pwd-duty-shift { color: var(--pw-ink-faint); }
.pwd-duty-pos { font-size: 10.5px; font-weight: 900; padding: 3px 9px; border-radius: var(--pw-r-pill); flex-shrink: 0; }
.pwd-duty-right { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.pwd-duty-time { font-size: 11px; font-weight: 700; color: var(--pw-ink-mute); }
.pwd-duty-now { font-size: 9.5px; font-weight: 900; color: var(--pw-gold-deep); background: var(--pw-paper); border: 1.5px solid var(--pw-gold); border-radius: var(--pw-r-pill); padding: 2px 8px; }
.sh-academy { background: #FCEFD6; color: var(--pw-gold-deep); }
.sh-hotelA { background: #E4ECF6; color: #2C4A6E; }
.sh-hotelB { background: #F4E2E0; color: #B0544E; }
.sh-hotelC { background: #E7E4F1; color: #6155A0; }
.sh-reception { background: #D6EFEA; color: #0E7490; }

/* Co-workers */
.pwd-coworkers { margin-top: 14px; padding-top: 13px; border-top: 1.5px solid var(--pw-cream-soft); }
.pwd-coworkers-lbl { font-size: 11px; font-weight: 900; color: var(--pw-ink-mute); }
.pwd-coworkers-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.pwd-coworker { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: var(--pw-ink-soft); background: var(--pw-cream-soft); border-radius: var(--pw-r-pill); padding: 4px 11px 4px 4px; }
.pwd-coworker-ava { width: 22px; height: 22px; border-radius: 50%; background: var(--pw-navy); color: #fff; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; }

/* Swap */
.pwd-swap-head { display: flex; align-items: center; justify-content: space-between; }
.pwd-swap-toggle { border: 1.5px solid var(--pw-navy); background: var(--pw-paper); color: var(--pw-navy); font-family: inherit; font-weight: 900; font-size: 12px; padding: 5px 13px; border-radius: var(--pw-r-pill); cursor: pointer; }
.pwd-swap-toggle:hover { background: var(--pw-navy); color: #fff; }
.pwd-swap-ok { margin-top: 12px; font-size: 12px; font-weight: 800; color: var(--pw-success); background: var(--pw-success-bg); border-radius: var(--pw-r-sm); padding: 11px 13px; }
.pwd-swap-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.pwd-swap-hint { font-size: 11px; font-weight: 700; color: var(--pw-ink-mute); }
.pwd-swap-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1.5px solid var(--pw-cream-deep); background: var(--pw-cream-soft); border-radius: var(--pw-r-md); padding: 11px 13px; font-family: inherit; cursor: pointer; transition: all .15s; }
.pwd-swap-item:hover { border-color: var(--pw-navy-light); background: var(--pw-paper); }
.pwd-swap-date { font-weight: 900; font-size: 13px; color: var(--pw-ink); flex-shrink: 0; }
.pwd-swap-shift { font-size: 11.5px; font-weight: 700; color: var(--pw-ink-mute); flex: 1; }
.pwd-swap-arr { font-size: 18px; font-weight: 700; color: var(--pw-ink-faint); }
.pwd-swap-cancel { border: none; background: none; font-family: inherit; font-weight: 800; font-size: 12px; color: var(--pw-ink-mute); cursor: pointer; padding: 4px; align-self: center; }

/* Leave records */
.pwd-leave-by-inline { font-size: 10.5px; font-weight: 700; color: var(--pw-ink-faint); margin-top: 2px; }
.pwd-larec { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
.pwd-larec-row { display: flex; align-items: center; gap: 10px; background: var(--pw-cream-soft); border-radius: var(--pw-r-md); padding: 9px 12px; }
.pwd-larec-type { font-size: 11px; font-weight: 900; padding: 3px 10px; border-radius: var(--pw-r-pill); flex-shrink: 0; }
.t-年假 { background: var(--pw-info-bg); color: var(--pw-info); }
.t-例假 { background: var(--pw-success-bg); color: var(--pw-success); }
.t-病假 { background: var(--pw-violet-bg); color: var(--pw-violet); }
.t-事假 { background: var(--pw-warn-bg); color: var(--pw-warn); }
.pwd-larec-date { font-size: 12.5px; font-weight: 800; color: var(--pw-ink); }
.pwd-larec-del { margin-left: auto; border: none; background: none; color: var(--pw-ink-faint); font-size: 13px; font-weight: 800; cursor: pointer; padding: 2px 4px; }
.pwd-larec-del:hover { color: var(--pw-danger); }
.pwd-la-form { margin-top: 14px; padding-top: 13px; border-top: 1.5px solid var(--pw-cream-soft); display: flex; flex-direction: column; gap: 12px; }
.pwd-la-row { display: flex; flex-direction: column; gap: 8px; }
.pwd-la-lbl { font-size: 11px; font-weight: 800; color: var(--pw-ink-mute); }
.pwd-la-types { display: flex; gap: 7px; }
.pwd-la-chip { flex: 1; border: 1.5px solid var(--pw-cream-deep); background: var(--pw-paper); color: var(--pw-ink-mute); font-family: inherit; font-weight: 800; font-size: 12px; padding: 8px 0; border-radius: var(--pw-r-pill); cursor: pointer; transition: all .15s; }
.pwd-la-chip.on { background: var(--pw-navy); border-color: var(--pw-navy); color: #fff; }
.pwd-la-days { display: flex; gap: 6px; }
.pwd-la-day { flex: 1; border: 1.5px solid var(--pw-cream-deep); background: var(--pw-paper); color: var(--pw-ink-soft); font-family: var(--pw-font-display); font-weight: 700; font-size: 15px; padding: 7px 0 6px; border-radius: var(--pw-r-md); cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: all .15s; }
.pwd-la-day i { font-style: normal; font-family: var(--pw-font-sans); font-size: 9px; font-weight: 800; color: var(--pw-ink-faint); margin-top: 1px; }
.pwd-la-day.on { background: var(--pw-gold); border-color: var(--pw-gold); color: var(--pw-ink); }
.pwd-la-day.on i { color: var(--pw-ink); }
.pwd-la-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pwd-la-confirm { border: none; background: var(--pw-navy); color: #fff; font-family: inherit; font-weight: 900; font-size: 13px; padding: 10px 20px; border-radius: var(--pw-r-pill); cursor: pointer; }
.pwd-la-confirm:disabled { opacity: .4; cursor: default; }
.pwd-la-daterow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
.pwd-la-datelbl { font-size: 12px; font-weight: 800; color: var(--pw-ink-mute); }
.pwd-la-date { border: 2px solid var(--pw-cream-deep); background: var(--pw-paper); border-radius: var(--pw-r-md); padding: 8px 12px; font-family: inherit; font-weight: 800; font-size: 13px; color: var(--pw-navy-deep); cursor: pointer; }
.pwd-la-date:focus { outline: none; border-color: var(--pw-navy-light); }

/* Leave / balance */
.pwd-leave-head { display: flex; align-items: center; justify-content: space-between; }
.pwd-leave-by { font-size: 10px; font-weight: 900; color: var(--pw-ink-faint); background: var(--pw-cream-soft); border-radius: var(--pw-r-pill); padding: 3px 9px; }
.pwd-ph { margin-top: 14px; }
.pwd-ph-lbl { font-size: 11px; font-weight: 800; color: var(--pw-ink-mute); margin-bottom: 7px; }
.pwd-ph-list { display: flex; flex-wrap: wrap; gap: 7px; }
.pwd-ph-chip { font-size: 11.5px; font-weight: 800; color: var(--pw-navy); background: var(--pw-info-bg); border-radius: var(--pw-r-sm); padding: 6px 11px; }
.pwd-ph-empty { font-size: 11.5px; font-weight: 700; color: var(--pw-ink-faint); }
.pwd-leave-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
.pwd-leave-cell { background: var(--pw-cream-soft); border-radius: var(--pw-r-md); padding: 11px 6px; text-align: center; }
.pwd-leave-cell-lbl { font-size: 10px; font-weight: 800; color: var(--pw-ink-mute); margin-bottom: 8px; line-height: 1.3; }
.pwd-leave-val { font-family: var(--pw-font-display); font-weight: 700; font-size: 18px; color: var(--pw-navy-deep); white-space: nowrap; }
.pwd-leave-val.big { font-size: 25px; }
.pwd-leave-val i { font-style: normal; font-family: var(--pw-font-sans); font-size: 10px; font-weight: 800; color: var(--pw-ink-faint); margin-left: 1px; }
.pwd-leave-edit { display: flex; align-items: center; justify-content: center; gap: 5px; }
.pwd-leave-edit button { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--pw-cream-deep); background: var(--pw-paper); color: var(--pw-navy); font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pwd-leave-edit button:hover { background: var(--pw-navy); border-color: var(--pw-navy); color: #fff; }
.pwd-leave-edit .pwd-leave-val { font-size: 16px; }

/* Readout / warnings */
.pwd-readout { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 700; color: var(--pw-ink-mute); padding: 2px 2px; flex-wrap: wrap; }
.pwd-readout b { color: var(--pw-ink); font-weight: 900; }
.pwd-readout-tag { background: var(--pw-cream-deep); color: var(--pw-ink-soft); font-weight: 900; font-size: 10px; letter-spacing: .04em; padding: 3px 9px; border-radius: var(--pw-r-pill); }
.pwd-monthbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.pwd-monthbar-lbl { font-size: 11px; font-weight: 900; letter-spacing: .04em; color: var(--pw-ink-mute); background: var(--pw-cream-deep); padding: 4px 10px; border-radius: var(--pw-r-pill); flex-shrink: 0; }
.pwd-monthsel { flex: 1; appearance: none; -webkit-appearance: none; font-family: var(--pw-font-sans); font-size: 14px; font-weight: 800; color: var(--pw-ink); background: var(--pw-paper); border: var(--pw-stroke) solid var(--pw-cream-deep); border-radius: var(--pw-r-md); padding: 9px 36px 9px 13px; cursor: pointer; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%232C4A6E' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat: no-repeat; background-position: right 13px center; }
.pwd-monthsel:focus { outline: none; border-color: var(--pw-navy-light); }
.pwd-warn { background: var(--pw-warn-bg); border: 1.5px solid #F4D77E; color: var(--pw-warn); border-radius: var(--pw-r-sm); padding: 10px 13px; font-size: 12px; font-weight: 700; }

/* Fixed badge */
.pwd-fixed { display: flex; align-items: center; gap: 8px; border-radius: var(--pw-r-sm); padding: 9px 13px; font-size: 12px; font-weight: 800; }
.pwd-fixed .pwd-fixed-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.pwd-fixed.on { background: var(--pw-success-bg); color: var(--pw-success); }
.pwd-fixed.off { background: var(--pw-cream-soft); color: var(--pw-ink-mute); border: 1.5px solid var(--pw-cream-deep); }

.pwd-foot { text-align: center; font-size: 11px; font-weight: 700; color: var(--pw-ink-faint); padding: 6px 0 2px; }

/* Hero A */
.pwd-heroA { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 22px 18px 20px; text-align: center; }
.pwd-heroA .pwd-eyebrow { align-self: center; }
.pwd-ring-num { font-family: var(--pw-font-display); font-weight: 700; font-size: 33px; color: var(--pw-navy-deep); line-height: 1; letter-spacing: -.01em; }
.pwd-ring-num .cur { font-size: 15px; color: var(--pw-gold-deep); vertical-align: super; margin-right: 1px; }
.pwd-ring-sub { font-size: 11px; font-weight: 800; color: var(--pw-ink-mute); margin-top: 7px; }
.pwd-heroA .pwd-fixed { width: 100%; justify-content: center; }
.pwd-comp { width: 100%; display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.pwd-comp-row { display: flex; align-items: center; gap: 9px; padding: 9px 2px; text-align: left; }
.pwd-comp-row + .pwd-comp-row { border-top: 1.5px solid var(--pw-cream-soft); }
.pwd-comp-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
.pwd-comp-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pwd-comp-label { font-weight: 900; font-size: 13px; color: var(--pw-ink); }
.pwd-comp-detail { font-size: 10.5px; font-weight: 700; color: var(--pw-ink-mute); }
.pwd-comp-pct { font-family: var(--pw-font-display); font-weight: 700; font-size: 13px; color: var(--pw-ink-faint); flex-shrink: 0; min-width: 34px; text-align: right; }
.pwd-comp-amt { font-family: var(--pw-font-display); font-weight: 700; font-size: 16px; color: var(--pw-navy-deep); flex-shrink: 0; min-width: 74px; text-align: right; }
.pwd-kpi-divider { display: flex; align-items: center; gap: 12px; padding: 6px 2px 0; }
.pwd-kpi-divider::before, .pwd-kpi-divider::after { content: ''; flex: 1; height: 1.5px; background: var(--pw-cream-deep); }
.pwd-kpi-divider span { font-size: 10.5px; font-weight: 900; letter-spacing: .04em; color: var(--pw-ink-faint); white-space: nowrap; }

/* Rate table */
.pwd-rate { background: var(--pw-paper); border-radius: var(--pw-r-lg); box-shadow: var(--pw-shadow-card); overflow: hidden; }
.pwd-rate-head { width: 100%; border: none; background: none; font-family: inherit; font-weight: 900; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--pw-ink-mute); padding: 15px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.pwd-rate-arr { transition: transform .3s; font-size: 14px; }
.pwd-rate-arr.open { transform: rotate(180deg); }
.pwd-rate-body { overflow: hidden; transition: max-height .38s ease; }
.pwd-rate-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 11px 18px; border-top: 1.5px solid var(--pw-cream-soft); }
.pwd-rate-lbl { font-weight: 800; font-size: 12.5px; color: var(--pw-ink-soft); }
.pwd-rate-rate { font-weight: 900; font-size: 12px; color: var(--pw-gold-deep); text-align: right; }
.pwd-rate-note { font-size: 10.5px; font-weight: 700; color: var(--pw-ink-faint); grid-column: 1 / -1; }

/* Payout ledger */
.pwd-ledger { display: flex; flex-direction: column; }
.pwd-led-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; }
.pwd-led-row + .pwd-led-row { border-top: 1.5px solid var(--pw-cream-soft); }
.pwd-led-lbl { font-size: 12.5px; font-weight: 800; color: var(--pw-ink-soft); }
.pwd-led-val { font-family: var(--pw-font-display); font-weight: 700; font-size: 16px; color: var(--pw-ink); }
.pwd-led-row.mul .pwd-led-lbl { color: var(--pw-ink-mute); }
.pwd-led-ratio { font-family: var(--pw-font-display); font-weight: 700; font-size: 18px; }
.pwd-led-ratio.full { color: var(--pw-success); }
.pwd-led-ratio.mid { color: var(--pw-gold-deep); }
.pwd-led-ratio.zero { color: var(--pw-danger); }
.pwd-led-row.total { border-top: 2px solid var(--pw-cream-deep); margin-top: 2px; }
.pwd-led-row.total .pwd-led-lbl { font-size: 13px; font-weight: 900; color: var(--pw-ink); }
.pwd-led-row.total .pwd-led-val { font-size: 22px; color: var(--pw-gold-deep); }

/* KPI scorecard */
.pwd-kpi { display: flex; flex-direction: column; gap: 12px; }
.pwd-kpi-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.pwd-kpi-band { font-size: 11.5px; font-weight: 800; color: var(--pw-ink-mute); margin-top: 4px; }
.pwd-kpi-band b { font-family: var(--pw-font-display); font-weight: 700; font-size: 14px; }
.pwd-kpi-score { flex-shrink: 0; display: flex; align-items: baseline; gap: 1px; }
.pwd-kpi-score .n { font-family: var(--pw-font-display); font-weight: 700; font-size: 34px; line-height: 1; }
.pwd-kpi-score .d { font-size: 12px; font-weight: 800; }
.r-full { color: var(--pw-success); }
.r-mid { color: var(--pw-gold-deep); }
.r-zero { color: var(--pw-danger); }
.pwd-kpi-meter { position: relative; height: 9px; border-radius: var(--pw-r-pill); background: var(--pw-cream-deep); overflow: visible; }
.pwd-kpi-meter-fill { height: 100%; border-radius: var(--pw-r-pill); background: var(--pw-navy); transition: width .5s ease; }
.pwd-kpi-meter-mark { position: absolute; top: -3px; bottom: -3px; width: 2.5px; background: var(--pw-gold-deep); border-radius: 2px; }
.pwd-kpi-scale { display: flex; font-size: 9.5px; font-weight: 800; color: var(--pw-ink-faint); margin-top: -4px; }
.pwd-kpi-items { display: flex; flex-direction: column; gap: 7px; }
.pwd-kpi-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1.5px solid var(--pw-cream-soft); background: var(--pw-cream-soft); border-radius: var(--pw-r-sm); padding: 9px 11px; font-family: inherit; }
.pwd-kpi-item.edit { cursor: pointer; transition: all .15s; }
.pwd-kpi-item.edit:hover { border-color: var(--pw-cream-deep); }
.pwd-kpi-check { width: 19px; height: 19px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; flex-shrink: 0; }
.pwd-kpi-item.pass .pwd-kpi-check { background: var(--pw-success); }
.pwd-kpi-item.fail .pwd-kpi-check { background: var(--pw-danger); }
.pwd-kpi-item.fail { opacity: .72; }
.pwd-kpi-text { flex: 1; font-size: 11.5px; font-weight: 700; color: var(--pw-ink-soft); line-height: 1.4; }
.pwd-kpi-team { font-style: normal; font-size: 9px; font-weight: 900; color: var(--pw-navy-light); background: var(--pw-info-bg); padding: 1px 5px; border-radius: var(--pw-r-pill); margin-left: 5px; vertical-align: middle; }
.pwd-kpi-w { font-family: var(--pw-font-display); font-weight: 700; font-size: 15px; color: var(--pw-ink-mute); flex-shrink: 0; }
.pwd-kpi-hint { font-size: 10.5px; font-weight: 700; color: var(--pw-ink-faint); text-align: center; }

/* KPI clauses */
.pwd-clauses { background: var(--pw-paper); border-radius: var(--pw-r-lg); box-shadow: var(--pw-shadow-card); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.pwd-clauses-head { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 900; color: var(--pw-danger); line-height: 1.4; }
.pwd-clauses-ico { font-size: 15px; flex-shrink: 0; }
.pwd-clause { display: flex; align-items: center; gap: 10px; background: var(--pw-cream-soft); border: 1.5px solid var(--pw-cream-deep); border-radius: var(--pw-r-md); padding: 11px 12px; }
.pwd-clause.hit { background: var(--pw-danger-bg); border-color: var(--pw-danger); }
.pwd-clause-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pw-ink-faint); flex-shrink: 0; }
.pwd-clause.hit .pwd-clause-dot { background: var(--pw-danger); }
.pwd-clause-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pwd-clause-text b { font-size: 12.5px; font-weight: 900; color: var(--pw-ink); line-height: 1.35; }
.pwd-clause-sub { font-size: 10.5px; font-weight: 700; color: var(--pw-ink-mute); }
.pwd-clause-tag { font-size: 10px; font-weight: 900; color: var(--pw-ink-mute); background: var(--pw-paper); border-radius: var(--pw-r-pill); padding: 4px 9px; flex-shrink: 0; white-space: nowrap; }
.pwd-clause-tag.hit { background: var(--pw-danger); color: #fff; }

/* Year-end pool */
.pwd-pool { display: flex; align-items: center; gap: 11px; background: #FFF7E8; border: 1.5px solid var(--pw-gold); border-radius: var(--pw-r-lg); padding: 12px 14px; }
.pwd-pool-ico { font-size: 26px; flex-shrink: 0; }
.pwd-pool-t { font-weight: 900; font-size: 13px; color: var(--pw-gold-deep); }
.pwd-pool-s { font-weight: 700; font-size: 11px; color: var(--pw-ink-mute); margin-top: 2px; line-height: 1.4; }

/* Goal unlock */
.pwd-goals { display: flex; flex-direction: column; gap: 11px; }
.pwd-goal { display: flex; gap: 11px; align-items: flex-start; }
.pwd-goal-ico { width: 30px; height: 30px; border-radius: 50%; background: var(--pw-cream-deep); color: var(--pw-ink-mute); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; flex-shrink: 0; }
.pwd-goal.hit .pwd-goal-ico { background: var(--pw-gold); color: var(--pw-ink); }
.pwd-goal-mid { flex: 1; min-width: 0; }
.pwd-goal-top { display: flex; align-items: center; gap: 7px; }
.pwd-goal-label { font-weight: 900; font-size: 13px; color: var(--pw-ink); }
.pwd-goal-scope { font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: var(--pw-r-pill); }
.pwd-goal-scope.s-team { background: var(--pw-info-bg); color: var(--pw-info); }
.pwd-goal-scope.s-me { background: var(--pw-success-bg); color: var(--pw-success); }
.pwd-goal-scope.s-mgr { background: var(--pw-violet-bg); color: var(--pw-violet); }
.pwd-goal-hint { font-size: 10px; font-weight: 800; color: var(--pw-gold-deep); background: #FFF7E8; border-radius: var(--pw-r-xs); padding: 4px 8px; margin-top: 6px; display: inline-block; }
.pwd-goal-bar { height: 6px; border-radius: var(--pw-r-pill); background: var(--pw-cream-deep); margin: 6px 0 5px; overflow: hidden; }
.pwd-goal-bar div { height: 100%; border-radius: var(--pw-r-pill); background: var(--pw-navy); transition: width .6s ease; }
.pwd-goal-bar div.hit { background: var(--pw-gold); }
.pwd-goal-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pwd-goal-num { font-size: 11px; font-weight: 800; color: var(--pw-ink-soft); white-space: nowrap; flex-shrink: 0; }
.pwd-goal-num i { font-style: normal; color: var(--pw-ink-faint); font-weight: 700; }
.pwd-goal-reward { font-size: 10px; font-weight: 800; color: var(--pw-ink-faint); text-align: right; line-height: 1.35; }
.pwd-goal-reward.on { color: var(--pw-success); }

/* Commission history */
.pwd-hist-cum { display: flex; flex-direction: column; margin-top: 8px; }
.pwd-hist-cum-num { font-family: var(--pw-font-display); font-weight: 700; font-size: 32px; color: var(--pw-navy-deep); line-height: 1; }
.pwd-hist-cum-num .cur { font-size: 15px; color: var(--pw-gold-deep); vertical-align: super; margin-right: 2px; }
.pwd-hist-cum-sub { font-size: 11px; font-weight: 700; color: var(--pw-ink-mute); margin-top: 6px; }
.pwd-hist-linewrap { margin-top: 14px; }
.pwd-hist-svg { width: 100%; height: auto; display: block; overflow: visible; }
.pwd-hist-x { font-size: 10px; font-weight: 800; fill: var(--pw-ink-mute); font-family: var(--pw-font-sans); }
.pwd-hist-x.now { fill: var(--pw-gold-deep); font-weight: 900; }
.pwd-hist-peak { font-size: 11px; font-weight: 900; fill: var(--pw-gold-deep); font-family: var(--pw-font-display); }
.pwd-hist-note { font-size: 11px; font-weight: 700; color: var(--pw-ink-mute); background: var(--pw-cream-soft); border-radius: var(--pw-r-sm); padding: 9px 12px; margin-top: 14px; line-height: 1.45; text-align: center; }

/* Club */
.pwd-club-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.pwd-club-sub { font-size: 11px; font-weight: 700; color: var(--pw-ink-mute); margin-top: 3px; }
.pwd-club-earned { flex-shrink: 0; font-size: 11px; font-weight: 800; color: var(--pw-ink-mute); background: var(--pw-cream-soft); border-radius: var(--pw-r-pill); padding: 6px 12px; white-space: nowrap; }
.pwd-club-earned b { font-family: var(--pw-font-display); font-weight: 700; font-size: 15px; color: var(--pw-gold-deep); margin-left: 3px; }
.pwd-club-tiers { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
.pwd-club-tier { background: var(--pw-cream-soft); border-radius: var(--pw-r-md); padding: 12px 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pwd-club-tier-dot { width: 9px; height: 9px; border-radius: 50%; }
.pwd-club-tier-name { font-weight: 900; font-size: 12.5px; color: var(--pw-ink); }
.pwd-club-tier-fee { font-size: 10px; font-weight: 700; color: var(--pw-ink-faint); }
.pwd-club-tier-bonus { font-family: var(--pw-font-display); font-weight: 700; font-size: 14px; color: var(--pw-navy-deep); margin-top: 1px; }
.pwd-club-add { width: 100%; margin-top: 14px; border: 1.5px solid var(--pw-navy); background: var(--pw-paper); color: var(--pw-navy); font-family: inherit; font-weight: 900; font-size: 13px; padding: 11px 0; border-radius: var(--pw-r-pill); cursor: pointer; }
.pwd-club-add:hover { background: var(--pw-navy); color: #fff; }
.pwd-club-form { margin-top: 14px; padding-top: 14px; border-top: 1.5px solid var(--pw-cream-soft); display: flex; flex-direction: column; gap: 10px; }
.pwd-club-frow { display: flex; gap: 8px; }
.pwd-club-input { flex: 1; min-width: 0; border: 1.5px solid var(--pw-cream-deep); background: var(--pw-paper); border-radius: var(--pw-r-md); padding: 10px 12px; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--pw-ink); }
.pwd-club-input::placeholder { color: var(--pw-ink-faint); font-weight: 600; }
.pwd-club-input:focus { outline: none; border-color: var(--pw-navy-light); }
.pwd-club-formacts { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pwd-club-hint { font-size: 10.5px; font-weight: 700; color: var(--pw-ink-mute); background: var(--pw-cream-soft); border-radius: var(--pw-r-sm); padding: 8px 11px; line-height: 1.45; }
.pwd-club-list { margin-top: 14px; padding-top: 14px; border-top: 1.5px solid var(--pw-cream-soft); display: flex; flex-direction: column; gap: 8px; }
.pwd-club-list-lbl { font-size: 11px; font-weight: 900; color: var(--pw-ink-mute); }
.pwd-club-nom { display: flex; align-items: center; gap: 10px; background: var(--pw-cream-soft); border-radius: var(--pw-r-md); padding: 10px 12px; }
.pwd-club-nom-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.pwd-club-nom-info { flex: 1; min-width: 0; }
.pwd-club-nom-info b { display: block; font-size: 13px; font-weight: 900; color: var(--pw-ink); }
.pwd-club-nom-owner { font-weight: 700; color: var(--pw-ink-mute); font-size: 11px; margin-left: 5px; }
.pwd-club-nom-info span { font-size: 10.5px; font-weight: 700; color: var(--pw-ink-mute); }
.pwd-club-status { font-size: 9.5px; font-weight: 900; padding: 4px 9px; border-radius: var(--pw-r-pill); flex-shrink: 0; text-align: center; line-height: 1.3; white-space: nowrap; }
.pwd-club-status.pending { background: var(--pw-warn-bg); color: var(--pw-warn); }
.pwd-club-status.approved { background: var(--pw-info-bg); color: var(--pw-info); }
.pwd-club-status.subscribed { background: var(--pw-success-bg); color: var(--pw-success); }
.pwd-club-status.rejected { background: var(--pw-cream-deep); color: var(--pw-ink-faint); }

/* Manager goal */
.pwd-mgrgoal { display: flex; flex-direction: column; gap: 12px; }
.pwd-mgrgoal-cur { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pwd-mgrgoal-lbl { font-size: 11px; font-weight: 800; color: var(--pw-ink-mute); }
.pwd-mgrgoal-rev { font-family: var(--pw-font-display); font-weight: 700; font-size: 26px; color: var(--pw-navy-deep); margin-top: 2px; }
.pwd-mgrgoal-amt { text-align: right; flex-shrink: 0; }
.pwd-mgrgoal-amt-num { display: block; font-family: var(--pw-font-display); font-weight: 700; font-size: 21px; color: var(--pw-gold-deep); }
.pwd-mgrgoal-amt-sub { font-size: 10px; font-weight: 800; color: var(--pw-ink-faint); }
.pwd-mgrgoal-next { font-size: 11.5px; font-weight: 800; color: var(--pw-gold-deep); background: #FFF7E8; border-radius: var(--pw-r-sm); padding: 9px 12px; line-height: 1.45; }
.pwd-mgrgoal-next b { font-weight: 900; color: var(--pw-ink); }
.pwd-mgrgoal-ladder { display: flex; flex-direction: column; gap: 6px; }
.pwd-mgrgoal-step { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: var(--pw-r-md); background: var(--pw-cream-soft); }
.pwd-mgrgoal-step.hit { background: #FCF4E4; }
.pwd-mgrgoal-step.cur { box-shadow: inset 0 0 0 1.5px var(--pw-gold); }
.pwd-mgrgoal-step-node { width: 20px; height: 20px; border-radius: 50%; background: var(--pw-cream-deep); color: #fff; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.pwd-mgrgoal-step.hit .pwd-mgrgoal-step-node { background: var(--pw-gold); }
.pwd-mgrgoal-step-min { font-weight: 900; font-size: 13px; color: var(--pw-ink); }
.pwd-mgrgoal-step-amt { margin-left: auto; font-family: var(--pw-font-display); font-weight: 700; font-size: 16px; color: var(--pw-navy-deep); }
.pwd-mgrgoal-step-tag { font-size: 9.5px; font-weight: 900; color: var(--pw-gold-deep); background: var(--pw-paper); border: 1.5px solid var(--pw-gold); border-radius: var(--pw-r-pill); padding: 2px 8px; flex-shrink: 0; }
.pwd-mgrgoal-foot { font-size: 10.5px; font-weight: 700; color: var(--pw-ink-mute); background: var(--pw-cream-soft); border-radius: var(--pw-r-sm); padding: 8px 11px; }

/* Stepper */
.pwd-step-field { display: flex; align-items: center; gap: 8px; }
.pwd-step-btn { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--pw-cream-deep); background: var(--pw-paper); color: var(--pw-navy); font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; }
.pwd-step-btn:hover { background: var(--pw-navy); border-color: var(--pw-navy); color: #fff; }
.pwd-step-mid { flex: 1; text-align: center; }
.pwd-step-num { font-family: var(--pw-font-display); font-weight: 700; font-size: 22px; color: var(--pw-ink); }
.pwd-step-suf { font-family: var(--pw-font-sans); font-size: 11px; font-weight: 800; color: var(--pw-ink-faint); margin-left: 2px; }
.pwd-step-hint { font-size: 9px; font-weight: 700; color: var(--pw-ink-faint); margin-top: 1px; }

/* Attendance dots */
.pwd-dots { display: flex; gap: 6px; flex-wrap: wrap; }
.pwd-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--pw-cream-deep); background: var(--pw-paper); color: var(--pw-ink-faint); font-size: 11px; font-weight: 800; font-family: inherit; display: flex; align-items: center; justify-content: center; }
.pwd-dot.edit { cursor: pointer; transition: all .15s; }
.pwd-dot.on { background: var(--pw-navy); border-color: var(--pw-navy); color: #fff; }

/* Manager panel */
.pwd-mgr-banner { display: flex; align-items: center; gap: 11px; background: var(--pw-navy); border-radius: var(--pw-r-lg); padding: 13px 15px; color: #fff; }
.pwd-mgr-banner-ico { font-size: 22px; flex-shrink: 0; }
.pwd-mgr-banner b { display: block; font-size: 14px; font-weight: 900; }
.pwd-mgr-banner span { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.7); }
.pwd-mgr-lock { margin-left: auto; flex-shrink: 0; border: 1.5px solid rgba(255,255,255,.4); background: transparent; color: #fff; font-family: inherit; font-weight: 800; font-size: 11.5px; padding: 6px 12px; border-radius: var(--pw-r-pill); cursor: pointer; }
.pwd-mgr-lock:hover { background: rgba(255,255,255,.14); }
.pwd-mgrgate { display: flex; flex-direction: column; align-items: center; padding: 24px 8px 8px; }
.pwd-mgrgate-lock { font-size: 34px; }
.pwd-mgrgate-title { font-weight: 900; font-size: 16px; color: var(--pw-ink); margin-top: 12px; }
.pwd-mgrgate-sub { font-size: 11.5px; font-weight: 700; color: var(--pw-ink-mute); margin-top: 5px; text-align: center; line-height: 1.5; max-width: 280px; }
.pwd-mgrgate-dots { display: flex; gap: 12px; margin-top: 22px; }
.pwd-mgrgate-dots.err { animation: pwShake .3s; }
.pwd-mgrgate-dot { width: 13px; height: 13px; border-radius: 50%; background: var(--pw-cream-deep); transition: all .15s; }
.pwd-mgrgate-dot.on { background: var(--pw-navy); transform: scale(1.05); }
@keyframes pwShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.pwd-mgrgate-err { font-size: 12px; font-weight: 800; color: var(--pw-danger); margin-top: 12px; }
.pwd-mgrgate-keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; margin-top: 22px; }

function DonutChart({ parts, total, size = 188, stroke = 24, children }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const gap = total > 0 ? 0.012 * c : 0;
  let acc = 0;
  const segs = parts.filter(p => p.value > 0).map(p => {
    const frac = p.value / total;
    const seg = { key: p.key, color: PARTS_META[p.key].color, len: Math.max(0, frac * c - gap), offset: -acc * c };
    acc += frac;
    return seg;
  });
  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)', display: 'block' }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--pw-cream-deep)" strokeWidth={stroke} />
        {segs.map(s => (
          <circle key={s.key} cx={size / 2} cy={size / 2} r={r} fill="none" stroke={s.color} strokeWidth={stroke}
            strokeDasharray={`${s.len} ${c - s.len}`} strokeDashoffset={s.offset}
            style={{ transition: 'stroke-dasharray .7s ease, stroke-dashoffset .7s ease' }} />
        ))}
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
        {children}
      </div>
    </div>
  );
}

// ═══════════ CommissionHistory ═══════════
function CommissionHistory({ history, current, monthLabel }) {
  const data = [...history, { m: monthLabel, v: Math.round(current), now: true }];
  let run = 0;
  const pts = data.map(d => { run += d.v; return { m: d.m, cum: run, now: d.now }; });
  const cumulative = run;
  const avg = Math.round(cumulative / data.length);
  const W = 320, H = 132, padX = 14, padTop = 16, padBot = 24;
  const maxCum = pts[pts.length - 1].cum || 1;
  const x = (i) => padX + (W - padX * 2) * (i / Math.max(1, pts.length - 1));
  const y = (v) => padTop + (H - padTop - padBot) * (1 - v / maxCum);
  const linePath = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(1)} ${y(p.cum).toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L ${x(pts.length - 1).toFixed(1)} ${H - padBot} L ${x(0).toFixed(1)} ${H - padBot} Z`;
  const last = pts[pts.length - 1];
  return (
    <div className="pwd-card pwd-block">
      <div className="pwd-eyebrow">本年累計佣金</div>
      <div className="pwd-hist-cum">
        <span className="pwd-hist-cum-num"><span className="cur">HK$</span>{moneyPlain(cumulative)}</span>
        <span className="pwd-hist-cum-sub">2026 年至今 · 平均每月 {money(avg)}</span>
      </div>
      <div className="pwd-hist-linewrap">
        <svg viewBox={`0 0 ${W} ${H}`} className="pwd-hist-svg" preserveAspectRatio="none">
          <defs>
            <linearGradient id="histFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="var(--pw-gold)" stopOpacity="0.32" />
              <stop offset="100%" stopColor="var(--pw-gold)" stopOpacity="0.02" />
            </linearGradient>
          </defs>
          <path d={areaPath} fill="url(#histFill)" />
          <path d={linePath} fill="none" stroke="var(--pw-gold-deep)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
          {pts.map((p, i) => (
            <g key={i}>
              <circle cx={x(i)} cy={y(p.cum)} r={p.now ? 5 : 3.5} fill={p.now ? 'var(--pw-gold-deep)' : 'var(--pw-paper)'} stroke="var(--pw-gold-deep)" strokeWidth="2" />
              <text x={x(i)} y={H - 8} textAnchor="middle" className={'pwd-hist-x' + (p.now ? ' now' : '')}>{p.m}</text>
            </g>
          ))}
          <text x={x(pts.length - 1)} y={y(last.cum) - 11} textAnchor="end" className="pwd-hist-peak">{money(last.cum)}</text>
        </svg>
      </div>
      <div className="pwd-hist-note">持續達標,多勞多得,累積越滾越大 🎯</div>
    </div>
  );
}

function datesFromWeekStart(weekStart) {
  const [y, m, d] = weekStart.split('-').map(Number);
  const base = new Date(y, m - 1, d);
  return WEEKDAYS.map((_, i) => { const dd = new Date(base); dd.setDate(base.getDate() + i); return dd.getDate(); });
}
// ── 週次導覽用日期 helper ──
function parseYMD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function fmtYMD(dt) { return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }
function mondayOf(dt) { const dow = (dt.getDay() + 6) % 7; const m = new Date(dt); m.setDate(dt.getDate() - dow); return m; }
function shiftWeekStart(ws, deltaWeeks) { const m = parseYMD(ws); m.setDate(m.getDate() + deltaWeeks * 7); return fmtYMD(m); }
function firstWeekStartOfMonth(month) { const [y, mo] = month.split('-').map(Number); return fmtYMD(mondayOf(new Date(y, mo - 1, 1))); }
// 該週覆蓋嗀月份(可能跨兩個月,例如 4月底–5月頭)
function weekMonths(ws) {
  const b = parseYMD(ws); const out = [];
  for (let i = 0; i < 7; i++) { const d = new Date(b); d.setDate(b.getDate() + i); const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); if (out.indexOf(k) < 0) out.push(k); }
  return out;
}
// 某週入面屬於指定月份嗀學院日數(畀即時統計用)
function acadInWeekForMonth(weekShifts, ws, month) {
  const b = parseYMD(ws); let c = 0;
  for (let i = 0; i < 7; i++) { const d = new Date(b); d.setDate(b.getDate() + i); const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); if (k === month && weekShifts[i] && weekShifts[i][1] === 'academy') c++; }
  return c;
}
function weekRangeLabel(ws) {
  const b = parseYMD(ws), e = new Date(b); e.setDate(b.getDate() + 6);
  const bM = b.getMonth() + 1, eM = e.getMonth() + 1;
  return bM === eM ? `${bM}月 ${b.getDate()}–${e.getDate()}日` : `${bM}月${b.getDate()}日 – ${eM}月${e.getDate()}日`;
}
const DEFAULT_WEEK = () => [['off', null], ['off', null], ['off', null], ['off', null], ['off', null], ['off', null], ['off', null]];
function normWeek(arr) { const w = (Array.isArray(arr) ? arr : []).map(r => Array.isArray(r) ? r.slice() : ['off', null]); while (w.length < 7) w.push(['off', null]); return w.slice(0, 7); }
function SaveBtn({ onSave, label = '儲存到 Google Sheet' }) {
  const [state, setState] = useState('idle'); // idle|saving|saved|err
  const [errMsg, setErrMsg] = useState('');
  async function go() {
    setState('saving');
    try {
      const r = await onSave();
      if (r && r.ok === false) {
        // 顯示後端真實原因；授權過期就教用戶點自救（唔好齋話「失敗」）
        const raw = r.error || '';
        setErrMsg(/未授權/.test(raw)
          ? '授權過期:請撳右上「🔒 鎖定」後重新輸入管理密碼,再儲存一次'
          : ('儲存失敗:' + (raw || '請重試')));
        setState('err'); setTimeout(() => setState('idle'), 6000);
      } else {
        setState('saved'); setTimeout(() => setState('idle'), 2500);
      }
    } catch (e) {
      setErrMsg('網絡錯誤,請檢查連線後重試');
      setState('err'); setTimeout(() => setState('idle'), 6000);
    }
  }
  return (
    <>
      <button className="pwd-mgr-savebtn" disabled={state === 'saving'} onClick={go}>
        {state === 'saving' ? '儲存中…' : state === 'saved' ? '✓ 已儲存' : label}
      </button>
      {state === 'err' && <div className="pwd-mgr-saved" style={{ color: 'var(--pw-danger)' }}>{errMsg}</div>}
    </>
  );
}

// ── KPI 評核 ──
function MgrKpi({ month, mgrData }) {
  const list = mgrData.staffList.filter(s => s.role !== 'manager');
  const [sel, setSel] = useState(list[0] ? list[0].id : null);
  const staff = list.find(s => s.id == sel);
  const k0 = mgrData.allKpi[sel] || { kpiFail: [], lateLeave: 0 };
  const [fail, setFail] = useState(() => k0.kpiFail.slice());
  const [lateLeave, setLate] = useState(k0.lateLeave || 0);
  const sl0 = (mgrData.allSales && mgrData.allSales[sel]) || {};
  const [sales, setSales] = useState(() => ({ s1New: sl0.s1New || 0, s2New: sl0.s2New || 0, comboNew: sl0.comboNew || 0 }));
  const [acadRank, setAcadRank] = useState(staff.acadRank || 'junior');
  // 學院出勤由更表自動計,唯讀
  const att = (mgrData.allAttendance && mgrData.allAttendance[sel] != null) ? mgrData.allAttendance[sel] : 0;
  function reseed(id) {
    const k = mgrData.allKpi[id] || { kpiFail: [], lateLeave: 0 };
    const sl = (mgrData.allSales && mgrData.allSales[id]) || {};
    const st = list.find(s => s.id == id) || {};
    setSel(id); setFail(k.kpiFail.slice()); setLate(k.lateLeave || 0);
    setSales({ s1New: sl.s1New || 0, s2New: sl.s2New || 0, comboNew: sl.comboNew || 0 });
    setAcadRank(st.acadRank || 'junior');
  }
  const items = buildScorecard(kpiRoleOf(staff), fail);
  const poolStaff = list.filter(s => s.role !== 'frontdesk' && s.dept !== 'academy');
  const acadWeightTotal = ACAD_WEIGHT_TOTAL;  // 固定分母 5,預留未填份額
  const { calc, kpi } = fullResult({ ...staff, ...sales, acadRank, attendance: att, kpiFail: fail, lateLeave }, { ...mgrData.team, acadWeightTotal, headcount: poolStaff.length || HEADCOUNT }, { scorecard: items, lateLeave });
  const score = scorecardTotal(items);
  const tone = kpi.ratio >= 1 ? 'full' : kpi.ratio > 0 ? 'mid' : 'zero';
  const toggle = (id) => setFail(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]);
  function save() { return pwApi('saveKpi', { month, staffId: sel, lateLeave, kpiFail: fail.join(','), s1New: sales.s1New, s2New: sales.s2New, comboNew: sales.comboNew, acadRank }); }
  return (
    <div className="pwd-mgr-stack">
      <div className="pwd-mgr-people">
        {list.map(s => (
          <button key={s.id} className={'pwd-mgr-person' + (sel == s.id ? ' on' : '')} onClick={() => reseed(s.id)}>
            <span className="pwd-mgr-person-ava">{s.initial}</span>{s.name}
          </button>
        ))}
      </div>
      <div className="pwd-card pwd-block">
        <div className="pwd-kpi-head">
          <div>
            <div className="pwd-eyebrow">{roleKpi(kpiRoleOf(staff)).label} · KPI 評核</div>
            <div className="pwd-kpi-band">發放比例 <b className={'r-' + tone}>{Math.round(kpi.ratio * 100)}%</b> · {kpi.band}</div>
          </div>
          <div className={'pwd-kpi-score r-' + tone}><span className="n">{score}</span><span className="d">分</span></div>
        </div>
        <div className="pwd-kpi-items">
          {items.map(it => (
            <button key={it.id} className={'pwd-kpi-item edit' + (it.pass ? ' pass' : ' fail')} onClick={() => toggle(it.id)}>
              <span className="pwd-kpi-check">{it.pass ? '✓' : '✕'}</span>
              <span className="pwd-kpi-text">{it.text}{it.team && <em className="pwd-kpi-team">團隊</em>}</span>
              <span className="pwd-kpi-w">{it.weight}</span>
            </button>
          ))}
        </div>
      </div>
      <div className="pwd-card pwd-mgr-late">
        <div className="pwd-mgr-late-row">
          <div><b>當月遲到 / 請假次數</b><span>超過 3 次 → KPI 直接為 0</span></div>
          <Stepper value={lateLeave} suffix="次" onChange={setLate} />
        </div>
        {lateLeave > 3 && <div className="pwd-warn" style={{ marginTop: 12 }}>已超過 3 次 — {staff.name} 本月 KPI 將為 0</div>}
      </div>
      {staff.role !== 'frontdesk' && (
        <div className="pwd-card pwd-block">
          <div className="pwd-eyebrow">{staff.name} · 學院新生銷售(個人歸成交者)</div>
          <div className="pwd-mgr-fieldgrid">
            <div className="pwd-mgr-field"><label>S1</label>
              <Stepper value={sales.s1New} suffix="隻" hint="$500" onChange={(v) => setSales(s => ({ ...s, s1New: v }))} /></div>
            <div className="pwd-mgr-field"><label>S2</label>
              <Stepper value={sales.s2New} suffix="隻" hint="$300" onChange={(v) => setSales(s => ({ ...s, s2New: v }))} /></div>
            <div className="pwd-mgr-field"><label>S1+S2</label>
              <Stepper value={sales.comboNew} suffix="隻" hint="$900" onChange={(v) => setSales(s => ({ ...s, comboNew: v }))} /></div>
          </div>
          <div className="pwd-eyebrow" style={{ marginTop: 14 }}>學院職級(舊生續報池按職級分)</div>
          <div className="pwd-club-tierconfirm">
            {[['assistant','助教'],['junior','初級導師'],['senior','資深導師']].map(([v, l]) => (
              <button key={v} className="pwd-club-tierconfirm-btn" style={acadRank === v ? { background: 'var(--pw-navy)', color: '#fff' } : {}} onClick={() => setAcadRank(v)}>{l}</button>
            ))}
          </div>
        </div>
      )}
      <div className="pwd-card pwd-mgr-result">
        <div className="pwd-eyebrow">{staff.name} 本月實際領取</div>
        <div className="pwd-mgr-result-num">{money(kpi.actualTotal)}</div>
        <div className="pwd-mgr-result-sub">計算 {money(calc.total)} × {Math.round(kpi.ratio * 100)}% 發放</div>
      </div>
      <SaveBtn onSave={save} label={`儲存 ${staff.name} 的評核`} />
    </div>
  );
}

function MgrSwap({ mgrData }) {
  const nameOf = (id) => { const s = mgrData.staffList.find(x => x.id == id); return s ? s.name : id; };
  const initOf = (id) => { const s = mgrData.staffList.find(x => x.id == id); return s ? s.initial : '?'; };
  const [reqs, setReqs] = useState(() => mgrData.allSwaps.map(r => ({ ...r })));
  async function act(id, status) {
    setReqs(rs => rs.map(r => r.id === id ? { ...r, status } : r));
    await pwApi('approveSwap', { swapId: id, status });
  }
  const pending = reqs.filter(r => r.status === 'pending');
  const done = reqs.filter(r => r.status !== 'pending');
  return (
    <div className="pwd-mgr-stack">
      <div className="pwd-card pwd-block">
        <div className="pwd-eyebrow">待審批 ({pending.length})</div>
        {pending.length === 0 ? <div className="pwd-ph-empty" style={{ marginTop: 12 }}>沒有待審批的換更申請</div> : (
          <div className="pwd-mgr-swaps">
            {pending.map(r => (
              <div key={r.id} className="pwd-mgr-swap">
                <div className="pwd-mgr-swap-top">
                  <span className="pwd-mgr-swap-ava">{initOf(r.staffId)}</span>
                  <div className="pwd-mgr-swap-info">
                    <b>{nameOf(r.staffId)} · {r.date}</b>
                    <span>{r.shift}{r.note ? ' · ' + r.note : ''}</span>
                  </div>
                </div>
                <div className="pwd-mgr-swap-acts">
                  <button className="pwd-btn-reject" onClick={() => act(r.id, 'rejected')}>拒絕</button>
                  <button className="pwd-btn-approve" onClick={() => act(r.id, 'approved')}>批准</button>
                </div>
              </div>
            ))}
          </div>
        )}

      {done.length > 0 && (
        <div className="pwd-card pwd-block">
          <div className="pwd-eyebrow">已處理</div>

                <span className="pwd-mgr-swap-ava">{initOf(r.staffId)}</span>
                <div className="pwd-mgr-swap-info"><b>{nameOf(r.staffId)} · {r.date}</b><span>{r.shift}</span></div>

              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── 請假 / 假期結餘 ──
function MgrLeave({ month, mgrData }) {
  const list = mgrData.staffList.filter(s => s.role !== 'manager');
  const [sel, setSel] = useState(list[0] ? list[0].id : null);
  const staff = list.find(s => s.id == sel);
  const b0 = mgrData.allLeaveBal[sel] || { annual: 0, statutory: 0, sick: 0 };
  const [bal, setBal] = useState({ annual: b0.annual, statutory: b0.statutory, sick: b0.sick });
  const [recs, setRecs] = useState(() => (mgrData.allLeaveRec[sel] || []).slice());
  const [type, setType] = useState('年假');
  const [date, setDate] = useState('');
  const [phs, setPhs] = useState(() => ((mgrData.allPH && mgrData.allPH[sel]) || []).slice());
  const [phName, setPhName] = useState('');
  const [phDate, setPhDate] = useState('');
  function reseed(id) {
    const b = mgrData.allLeaveBal[id] || { annual: 0, statutory: 0, sick: 0 };
    setSel(id); setBal({ annual: b.annual, statutory: b.statutory, sick: b.sick });
    setRecs((mgrData.allLeaveRec[id] || []).slice()); setDate('');
    setPhs(((mgrData.allPH && mgrData.allPH[id]) || []).slice()); setPhName(''); setPhDate('');
  }
  const adj = (k, d) => setBal(b => ({ ...b, [k]: Math.max(0, +(b[k] + d).toFixed(1)) }));
  const fmtDate = (iso) => { const [, m, d] = iso.split('-'); return `${+m}月${+d}日`; };
  function saveBal() { return pwApi('saveLeave', { month, staffId: sel, annual: bal.annual, statutory: bal.statutory, sick: bal.sick }); }
  async function addRec() {
    if (!date) return;
    const ds = fmtDate(date);
    setRecs(r => [...r, { date: ds, type }]);
    setDate('');
    await pwApi('addLeaveRec', { month, staffId: sel, date: ds, type });
  }
  async function delRec(rec, i) {
    setRecs(r => r.filter((_, j) => j !== i));
    await pwApi('deleteLeaveRec', { month, staffId: sel, date: rec.date, type: rec.type });
  }
  async function addPH() {
    if (!phName.trim() || !phDate) return;
    const ds = fmtDate(phDate);
    setPhs(p => [...p, { name: phName.trim(), date: ds }]);
    setPhName(''); setPhDate('');
    await pwApi('addPH', { month, staffId: sel, name: phName.trim(), date: ds });
  }
  async function delPH(p, i) {
    setPhs(arr => arr.filter((_, j) => j !== i));
    await pwApi('deletePH', { month, staffId: sel, name: p.name, date: p.date });
  }
  return (
    <div className="pwd-mgr-stack">
      <div className="pwd-mgr-people">
        {list.map(s => (
          <button key={s.id} className={'pwd-mgr-person' + (sel == s.id ? ' on' : '')} onClick={() => reseed(s.id)}>
            <span className="pwd-mgr-person-ava">{s.initial}</span>{s.name}
          </button>
        ))}
      </div>
      <div className="pwd-card pwd-block">
        <div className="pwd-eyebrow">{staff.name} · 假期結餘 (可調整)</div>
        <div className="pwd-leave-grid">
          {[ { key: 'annual', lbl: '尚餘年假', step: 1 }, { key: 'statutory', lbl: '例假結餘', step: 1 }, { key: 'sick', lbl: '累積有薪病假', step: 0.5 } ].map(c => (
            <div key={c.key} className="pwd-leave-cell">
              <div className="pwd-leave-cell-lbl">{c.lbl}</div>
              <div className="pwd-leave-edit">
                <button onClick={() => adj(c.key, -c.step)}>−</button>
                <span className="pwd-leave-val">{bal[c.key]}<i>日</i></span>
                <button onClick={() => adj(c.key, c.step)}>＋</button>
              </div>
            </div>
          ))}
        </div>
        <div style={{ marginTop: 14 }}><SaveBtn onSave={saveBal} label="儲存結餘" /></div>
      </div>
      <div className="pwd-card pwd-block">
        <div className="pwd-eyebrow">登記請假</div>
        <div className="pwd-la-types" style={{ marginTop: 12 }}>
          {['年假', '例假', '病假', '事假'].map(t => (
            <button key={t} className={'pwd-la-chip' + (type === t ? ' on' : '')} onClick={() => setType(t)}>{t}</button>
          ))}
        </div>
        <div className="pwd-la-daterow">
          <span className="pwd-la-datelbl">請假日期</span>
          <input className="pwd-la-date" type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        </div>
        <button className="pwd-la-confirm" style={{ marginTop: 12, width: '100%' }} disabled={!date} onClick={addRec}>
          ＋ 為 {staff.name} 登記{date ? ` ${fmtDate(date)} ` : ''}{type}
        </button>
        <div className="pwd-larec" style={{ marginTop: 14 }}>
          {recs.map((rec, i) => (
            <div key={i} className="pwd-larec-row">
              <span className={'pwd-larec-type t-' + rec.type}>{rec.type}</span>
              <span className="pwd-larec-date">{rec.date}</span>
              <button className="pwd-larec-del" onClick={() => delRec(rec, i)}>✕</button>
            </div>
          ))}
        </div>
      </div>
      <div className="pwd-card pwd-block">
        <div className="pwd-eyebrow">待放公眾假期 (員工頁顯示)</div>
        <div className="pwd-club-frow" style={{ marginTop: 12 }}>
          <input className="pwd-club-input" placeholder="假期名稱(例:勞動節)" value={phName} onChange={(e) => setPhName(e.target.value)} />
          <input className="pwd-la-date" type="date" value={phDate} onChange={(e) => setPhDate(e.target.value)} />
        </div>
        <button className="pwd-la-confirm" style={{ marginTop: 12, width: '100%' }} disabled={!phName.trim() || !phDate} onClick={addPH}>
          ＋ 為 {staff.name} 登記待放公眾假期
        </button>
        <div className="pwd-larec" style={{ marginTop: 14 }}>
          {phs.map((p, i) => (
            <div key={i} className="pwd-larec-row">
              <span className="pwd-larec-type">🎌 {p.name}</span>
              <span className="pwd-larec-date">{p.date}</span>
              <button className="pwd-larec-del" onClick={() => delPH(p, i)}>✕</button>
            </div>
          ))}
          {phs.length === 0 && <div className="pwd-ph-empty">未有登記待放公眾假期</div>}
        </div>
      </div>
    </div>
  );
}

// ── 排更 ──
function MgrRoster({ mgrData }) {
  const list = mgrData.staffList;
  const [sel, setSel] = useState(list[0] ? list[0].id : null);
  const [weekStart, setWeekStart] = useState(() => mgrData.weekStart); // 由本週開始,用左右鍵自由揭週次
  const [shifts, setShifts] = useState(() => weekStart === mgrData.weekStart && mgrData.allRosters[sel] ? normWeek(mgrData.allRosters[sel]) : null);
  const [savedShifts, setSavedShifts] = useState(() => weekStart === mgrData.weekStart && mgrData.allRosters[sel] ? normWeek(mgrData.allRosters[sel]) : DEFAULT_WEEK());
  const [loading, setLoading] = useState(false);
  const [days, setDays] = useState({}); // { 'YYYY-MM': 學院日數 }
  const wMonths = weekMonths(weekStart); // 該週覆蓋嗀月份
  const SHIFT_CYCLE = ['early', 'mid', 'full', 'off'];
  const SHIFT_LABEL = { early: '早更', mid: '午更', full: '全日更', off: '休息' };
  const POS_LABEL = { academy: '學院', hotelA: '酒店A位', hotelB: '酒店B位', hotelC: '酒店C位', reception: '前台' };

  // 載入所選員工 + 所選週次嗀更表
  useEffect(() => {
    let active = true;
    setLoading(true);
    pwApi('rosterWeek', { staffId: sel, weekStart }).then(res => {
      if (!active) return;
      const w = res && res.ok ? normWeek(res.shifts) : DEFAULT_WEEK();
      setShifts(w); setSavedShifts(w);
      setLoading(false);
    }).catch(() => { if (active) { setShifts(DEFAULT_WEEK()); setSavedShifts(DEFAULT_WEEK()); setLoading(false); } });
    return () => { active = false; };
  }, [sel, weekStart]);

  // 載入該週覆蓋嗀每個月嗀學院日數
  function refreshDays() {
    const s = sel;
    weekMonths(weekStart).forEach(mth => {
      pwApi('academyDays', { staffId: s, month: mth }).then(res => {
        if (res && res.ok && s === sel) setDays(prev => ({ ...prev, [mth]: res.days }));
      }).catch(() => {});
    });
  }
  useEffect(() => { setDays({}); refreshDays(); }, [sel, weekStart]);

  const cur = normWeek(shifts || DEFAULT_WEEK());
  const dates = datesFromWeekStart(weekStart);
  const setDay = (i, shift, pos) => {
    setShifts(prev => {
      const next = normWeek(prev || DEFAULT_WEEK());
      next[i] = [shift, shift === 'off' ? null : pos];
      return next;
    });
  };
  async function save() {
    const r = await pwApi('saveRoster', { weekStart, staffId: sel, shifts: JSON.stringify(cur) });
    setSavedShifts(cur);
    refreshDays();
    return r;
  }
  const unsaved = JSON.stringify(cur) !== JSON.stringify(savedShifts);
  return (
    <div className="pwd-mgr-stack">
      <div className="pwd-mgr-people">
        {list.map(s => (
          <button key={s.id} className={'pwd-mgr-person' + (sel == s.id ? ' on' : '')} onClick={() => setSel(s.id)}>
            <span className="pwd-mgr-person-ava">{s.initial}</span>{s.name}
          </button>
        ))}
      </div>
      {wMonths.map(mth => {
        const base = days[mth];
        const known = typeof base === 'number';
        // 即時計:已存總數 − 本週已存學院 + 本週畫面上嗀學院
        const n = known ? base - acadInWeekForMonth(savedShifts, weekStart, mth) + acadInWeekForMonth(cur, weekStart, mth) : null;
        const ok = known && n >= 4;
        return (
          <div key={mth} className={'pwd-card pwd-attsum' + (ok ? ' ok' : '')}>
            <div><b>{list.find(s => s.id == sel).name}</b> · {monthLabelFull(mth)} 學院日數</div>
            <b className="pwd-attsum-n">{known ? n : '…'} 日{ok ? ' ✓' : (known ? ` · 差 ${Math.max(0, 4 - n)} 日` : '')}</b>
          </div>
        );
      })}
      {unsaved && <div className="pwd-mgr-rostersave" style={{ color: 'var(--pw-gold-deep)', fontWeight: 800 }}>⚠ 未發佈 — 記得撳下面「發佈本週排更」先會存入系統</div>}
      <div className="pwd-card pwd-block">
        <div className="pwd-roster-weeknav">
          <button className="pwd-weeknav-btn" onClick={() => setWeekStart(w => shiftWeekStart(w, -1))}>◀ 上週</button>
          <div className="pwd-weeknav-label">{weekRangeLabel(weekStart)}</div>
          <button className="pwd-weeknav-btn" onClick={() => setWeekStart(w => shiftWeekStart(w, 1))}>下週 ▶</button>
        </div>
        {loading ? <div className="pwd-loading-txt" style={{ color: 'var(--pw-ink-mute)', padding: '20px 0' }}>載入更表…</div> : (
        <div className="pwd-duty" style={{ marginTop: 14 }}>
          {WEEKDAYS.map((wd, i) => {
            const r = cur[i] || ['off', null];
            const off = r[0] === 'off';
            return (
              <div key={i} className={'pwd-duty-row' + (off ? ' off' : '')}>
                <div className="pwd-duty-date"><span className="pwd-duty-wd">{wd}</span><span className="pwd-duty-num">{dates[i]}</span></div>
                <div className="pwd-mgr-selwrap">
                  <select className="pwd-mgr-sel" value={r[0]} onChange={(e) => setDay(i, e.target.value, r[1])}>
                    {SHIFT_CYCLE.map(k => <option key={k} value={k}>{SHIFT_LABEL[k]}</option>)}
                  </select>
                </div>
                <div className="pwd-mgr-selwrap">
                  <select className={'pwd-mgr-sel pos' + (r[1] ? ' sh-' + r[1] : '')} value={r[1] || ''} disabled={off} onChange={(e) => setDay(i, r[0], e.target.value || null)}>
                    {off ? <option value="">—</option> : [
                      <option key="none" value="">未定崗</option>,
                      ...['academy', 'hotelA', 'hotelB', 'hotelC', 'reception'].map(k => <option key={k} value={k}>{POS_LABEL[k]}</option>),
                    ]}
                  </select>
                </div>
              </div>
            );
          })}
        </div>
        )}
      </div>
      <SaveBtn onSave={save} label="發佈本週排更" />
      <div className="pwd-mgr-rostersave">發佈後員工即時看到 · 學院日數會即時更新</div>
    </div>
  );
}
